changelog:
  - type: NEW_FEATURE
    issueLink: https://github.com/solo-io/solo-kit/pull/TODO
    resolvesIssue: false
    description: >-
      Add the WithSecretsFieldSelector option to NewKubeCoreCacheWithOptions,
      which limits the Secrets the Kubernetes core cache lists and watches to
      those matching a field selector, for example
      "type!=helm.sh/release.v1,type!=kubernetes.io/service-account-token". The
      API server applies the selector, so excluded Secrets are never sent to or
      stored by the cache, which reduces API traffic and memory in clusters with
      many Secrets the consumer does not use, such as Helm release storage. The
      secret listers and the kube secret resource client's List and Watch do not
      return excluded Secrets; Read fetches by name directly and still does.
      Without the option, or with a nil or empty selector, the cache stores every
      Secret, as before. Secrets support selecting on metadata.name,
      metadata.namespace and type only; the API server rejects other fields,
      which leaves the cache unable to sync. NewKubeCoreCacheWithOptions now
      accepts options as a variadic final parameter, so existing calls compile
      unchanged.
