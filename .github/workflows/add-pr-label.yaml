name: PR Auto Labeling
on:
  pull_request:
    types:
      - opened
jobs:
  add-label:
    name: Add `keep pr updated` Label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: christianvuerings/add-labels@b3cc83b6b466869c556a6623c93f1321485dbda0 # v1
        with:
          labels: |
            keep pr updated
        env:
          GITHUB_TOKEN: ${{ github.token }}
